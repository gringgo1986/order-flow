<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1d36" />
      <stop offset="70%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- Center Decorative Glow -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.35" />

  <!-- Stylized Lightning & Candlestick Glyph -->
  <path d="M 276 96 L 180 264 L 252 264 L 236 416 L 332 248 L 260 248 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- Footprint / Orderflow Horizontal Grid Accents -->
  <line x1="120" y1="210" x2="160" y2="210" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
  <line x1="100" y1="256" x2="150" y2="256" stroke="#00e676" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  <line x1="120" y1="302" x2="160" y2="302" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />

  <line x1="352" y1="210" x2="392" y2="210" stroke="#00e676" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
  <line x1="362" y1="256" x2="412" y2="256" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  <line x1="352" y1="302" x2="392" y2="302" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />

  <!-- Text Badge -->
  <text x="256" y="460" font-family="'JetBrains Mono', monospace, sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="3">XAUUSD FLOW</text>
</svg>
